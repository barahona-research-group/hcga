[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcga"
version = "2.0.0.dev0"
description = "Highly comparative graph analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Robert Peach" },
    { name = "Alexis Arnaudon" },
    { name = "Henry Palasciano" },
]
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "tqdm>=4.45",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "shap>=0.50",  # earlier versions cannot read xgboost>=3.1 model files
    "pandas>=2.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx", "sphinx_click"]

[project.scripts]
hcga = "hcga.app:cli"

[tool.setuptools.packages.find]
include = ["hcga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
